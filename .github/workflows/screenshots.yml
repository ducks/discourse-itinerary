name: Screenshots

# Captures screenshots of the plugin's pages and publishes them to
# GitHub Pages. Delegates the heavy lifting to a reusable workflow
# in discourse-plugin-screenshots, which runs inside Discourse's
# official test container.
#
# What gets captured comes from config/screenshots.yml in this repo.

on:
  push:
    branches: [main]
    paths:
      # Only rebuild screenshots when something that can change
      # the rendered output actually changes. Server-only files
      # (lib/, spec/) and meta files (README, other workflows)
      # don't trigger a run. workflow_dispatch is always there
      # for manual re-captures.
      - "assets/**"
      - "config/screenshots.yml"
      - "app/**"
      - "plugin.rb"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  screenshots:
    uses: ducks/discourse-plugin-screenshots/.github/workflows/plugin-screenshots.yml@main
